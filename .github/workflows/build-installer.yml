name: Build installer

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "catalog.json"
      - "lsp/**"
      - "tools/**"
      - "src-modern/**"
      - "README.md"
      - ".github/workflows/build-installer.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build CAD 런처 (요즘 스타일, src-modern)
        shell: cmd
        run: |
          cd src-modern
          go build -ldflags "-H windowsgui -s -w" -o build\CAD런처.exe .

      - name: Copy WebView2Loader.dll next to the exe (메모리 로딩 대신 파일로 불러오게)
        shell: pwsh
        working-directory: src-modern
        run: |
          $dir = go list -m -f '{{.Dir}}' github.com/jchv/go-webview2
          Copy-Item "$dir\webviewloader\sdk\x64\WebView2Loader.dll" "build\WebView2Loader.dll"

      - name: Download WebView2 Evergreen Bootstrapper
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "installer\MicrosoftEdgeWebView2Setup.exe"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\cad-launcher.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAD런처-설치
          path: installer/output/CAD런처-설치.exe
