<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CAD 런처</title>
<style>
  :root{
    --bg:#F7F4EC; --panel:#FFFFFF; --border:#E7E1D3;
    --text:#2D2924; --sub:#8C857A; --sub2:#B3ACA0;
    --accent:#CC785C; --accent-dk:#AD5F46; --accent-ink:#FFFFFF;
    --hover:#EFEADC; --selected:#F1E2DA; --selected-ink:#9C4A2E;
    --radius:10px; --radius-lg:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Segoe UI Variable","Segoe UI","맑은 고딕",sans-serif;
    background:var(--bg); color:var(--text); font-size:13.5px;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }

  /* ───── 상단 바 ───── */
  .topbar{
    display:flex; align-items:center; gap:10px;
    padding:12px 16px; border-bottom:1px solid var(--border);
    background:var(--panel);
  }
  .topbar .brand{font-weight:700; font-size:15px; margin-right:6px; white-space:nowrap;}
  .field{
    display:flex; align-items:center; gap:6px; background:var(--bg);
    border:1px solid var(--border); border-radius:var(--radius);
    padding:6px 10px; flex:0 0 auto;
  }
  .field input, .field select{
    border:none; background:transparent; outline:none; font-size:13px; color:var(--text);
    min-width:150px;
  }
  .field.grow{flex:1 1 auto;}
  .field.grow select{min-width:0; width:100%;}
  .spacer{flex:1 1 auto;}

  button{
    font-family:inherit; font-size:13px; cursor:pointer;
    border-radius:var(--radius); border:1px solid var(--border);
    background:var(--panel); color:var(--text); padding:7px 14px;
    transition:background .12s ease, transform .05s ease, box-shadow .12s ease;
  }
  button:hover{background:var(--hover);}
  button:active{transform:translateY(1px);}
  button.ghost{background:transparent;}
  button.primary{
    background:var(--accent); color:var(--accent-ink); border-color:var(--accent-dk);
    font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.08);
  }
  button.primary:hover{background:var(--accent-dk);}
  button.primary.big{padding:10px 22px; border-radius:999px; font-size:14px;}
  button.icon-btn{
    width:34px; height:34px; padding:0; border-radius:999px;
    display:flex; align-items:center; justify-content:center; font-size:17px; line-height:1;
  }

  /* ───── 고급 설정 오버레이 ───── */
  .overlay{
    position:fixed; inset:0; background:rgba(45,41,36,.35);
    display:none; align-items:center; justify-content:center; z-index:50;
  }
  .overlay.show{display:flex;}
  .overlay .panel{
    width:420px; max-width:90vw; background:var(--panel); border-radius:var(--radius-lg);
    padding:20px 22px; box-shadow:0 12px 32px rgba(0,0,0,.18);
  }
  .overlay .panel h2{font-size:15px; margin:0 0 14px 0;}
  .overlay .opt-row label{width:120px; flex:0 0 120px; font-size:13px;}
  .overlay .opt-row select, .overlay .opt-row input[type=text]{
    padding:6px 9px; border:1px solid var(--border); border-radius:8px; background:#fff; font-size:13px; outline:none;
  }
  .check-row{display:flex; align-items:center; gap:8px; padding:7px 0; font-size:13px; cursor:pointer;}
  .check-row input{width:16px; height:16px;}
  .hr{height:1px; background:var(--border); margin:12px 0;}
  .panel-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:16px;}
  .row-send{display:flex; gap:8px; align-items:center;}
  .row-send input{flex:1 1 auto;}

  /* ───── 본문 레이아웃 ───── */
  .main{flex:1 1 auto; display:flex; min-height:0;}
  .sidebar{
    width:300px; flex:0 0 300px; overflow-y:auto; padding:10px;
    border-right:1px solid var(--border);
  }
  .cat{margin-bottom:4px;}
  .cat-head{
    display:flex; align-items:center; gap:6px; padding:8px 10px;
    border-radius:var(--radius); cursor:pointer; font-weight:700; user-select:none;
  }
  .cat-head:hover{background:var(--hover);}
  .cat-head .chev{display:inline-block; transition:transform .15s ease; color:var(--sub2); font-size:11px; width:10px;}
  .cat-head.collapsed .chev{transform:rotate(-90deg);}
  .cat-head .tag{font-weight:400; color:var(--sub); font-size:12px;}
  .cat-items{display:flex; flex-direction:column; gap:2px; padding:2px 2px 8px 18px; overflow:hidden;}
  .cat-items.collapsed{display:none;}
  .item{
    padding:7px 10px; border-radius:var(--radius); cursor:pointer;
    display:flex; flex-direction:column; gap:1px;
  }
  .item:hover{background:var(--hover);}
  .item.selected{background:var(--selected); color:var(--selected-ink);}
  .item .name{font-size:13px;}
  .item .cmd{font-size:11.5px; color:var(--sub2);}
  .item.selected .cmd{color:var(--selected-ink); opacity:.75;}

  .content{flex:1 1 auto; display:flex; flex-direction:column; padding:20px 24px; min-width:0; overflow-y:auto;}
  .content h1{font-size:19px; margin:0 0 2px 0;}
  .content .desc{color:var(--sub); font-size:13px; margin-bottom:16px;}

  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:14px 16px; margin-bottom:14px;
  }
  .card h2{font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--sub); margin:0 0 10px 0; font-weight:700;}
  .opt-row{display:flex; align-items:center; gap:10px; padding:6px 0;}
  .opt-row label{width:150px; flex:0 0 150px; color:var(--text); font-size:13px;}
  .opt-row input[type=text], .opt-row input[type=number], .opt-row select{
    flex:1 1 auto; padding:6px 9px; border:1px solid var(--border); border-radius:8px;
    background:#fff; font-size:13px; outline:none;
  }
  .opt-row input[type=checkbox]{width:18px; height:18px;}
  .manual{
    white-space:pre-wrap; line-height:1.55; font-size:13px; color:var(--text);
    flex:1 1 auto;
  }
  .actions{display:flex; gap:10px; margin-top:auto; padding-top:14px;}

  .empty{margin:auto; color:var(--sub2); text-align:center; font-size:13px;}

  /* ───── 로그 ───── */
  .logwrap{
    border-top:1px solid var(--border); background:var(--panel);
    height:120px; flex:0 0 120px; display:flex; flex-direction:column;
  }
  .logwrap .loghead{
    padding:6px 14px; font-size:11.5px; color:var(--sub); display:flex; justify-content:space-between;
  }
  .log{
    flex:1 1 auto; overflow-y:auto; padding:0 14px 10px 14px;
    font-family:Consolas,"맑은 고딕",monospace; font-size:12px; color:var(--sub);
  }
  .log div{padding:1px 0;}

  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">CAD 런처</div>
    <div class="field">
      <span style="color:var(--sub)">창 제목</span>
      <input id="kw" value="AutoCAD LT">
    </div>
    <button id="btnFind">창 찾기</button>
    <div class="field grow" style="max-width:260px">
      <select id="winSel"><option>(창 찾기를 눌러주세요)</option></select>
    </div>
    <div class="spacer"></div>
    <button id="btnUpdCfg" class="icon-btn" title="업데이트 설정">↻</button>
    <button id="btnAdv">고급 설정</button>
  </div>

  <div class="overlay" id="advOverlay">
    <div class="panel">
      <h2>고급 설정</h2>

      <div class="opt-row">
        <label>전송 방식</label>
        <select id="advMethod"><option>WM_COPYDATA</option><option>키입력</option></select>
      </div>
      <label class="check-row"><input type="checkbox" id="advCancel" checked> 실행 전 진행 중 명령 취소</label>
      <label class="check-row"><input type="checkbox" id="advTop"> 항상 위 (런처 창을 다른 창 위에 고정)</label>
      <div class="opt-row">
        <label>옵션파일 인코딩</label>
        <select id="advEnc"><option>cp949</option><option>utf-8</option></select>
      </div>
      <div class="opt-row row-send">
        <label>직접 명령</label>
        <input type="text" id="advFree" placeholder="예: GGA">
        <button id="advSend">보내기</button>
      </div>

      <div class="hr"></div>
      <button id="advCheckUpdate" class="ghost">업데이트 확인</button>

      <div class="panel-actions">
        <button id="advClose" class="primary">닫기</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="content">
      <div class="empty">왼쪽 목록에서 기능을 선택하세요.</div>
    </div>
  </div>

  <div class="logwrap">
    <div class="loghead"><span>로그</span></div>
    <div class="log" id="log"></div>
  </div>

<script>
const catalog = window.__CATALOG__ || {lisps:[], categories:[]};
const state = window.__STATE__ || {keyword:'AutoCAD LT', method:'WM_COPYDATA', encoding:'cp949', cancel:true, topmost:false, values:{}};
const sidebar = document.getElementById('sidebar');
const content = document.getElementById('content');
const logEl = document.getElementById('log');
const winSel = document.getElementById('winSel');
let selectedWindow = -1;

function log(msg){
  const t = new Date().toTimeString().slice(0,8);
  const d = document.createElement('div');
  d.textContent = '[' + t + '] ' + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

// 업데이트 확인·외부 프로그램 설치처럼 시간이 걸리는 작업의 결과가 나중에 여기로 들어온다.
window.onBackendEvent = function(kind, payload){
  if(payload && payload.error){ log((kind==='updateResult'?'업데이트 확인 실패: ':'외부 프로그램 설치 실패: ') + payload.error); return; }
  if(payload && payload.message){ payload.message.split('\n').forEach(line => log(line)); }
};

function findWindows(){
  const kw = document.getElementById('kw').value;
  window.setKeyword(kw);
  log('CAD 창 찾는 중... (' + kw + ')');
  window.findWindows(kw).then(titles => {
    winSel.innerHTML = '';
    if(!titles.length){
      winSel.innerHTML = '<option>(찾은 창 없음)</option>';
      selectedWindow = -1;
      log('CAD 창을 찾지 못함 - LT 실행 여부와 키워드를 확인하세요');
      return;
    }
    titles.forEach((t, i) => {
      const opt = document.createElement('option');
      opt.value = i; opt.textContent = t;
      winSel.appendChild(opt);
    });
    selectedWindow = 0;
    log('CAD 창 ' + titles.length + '개 찾음');
  }).catch(err => log('창 찾기 오류: ' + err));
}
winSel.addEventListener('change', () => { selectedWindow = parseInt(winSel.value, 10); });

function lispTagFor(items){
  const seen = [];
  for(const it of items){ if(it.lisp && seen.indexOf(it.lisp)===-1) seen.push(it.lisp); }
  return seen.length ? '  (' + seen.join(' · ') + ')' : '';
}

function renderSidebar(){
  sidebar.innerHTML = '';
  (catalog.categories||[]).forEach((cat, ci) => {
    const wrap = document.createElement('div');
    wrap.className = 'cat';

    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = '<span class="chev">▾</span><span>' + cat.name + '</span><span class="tag">' + lispTagFor(cat.items||[]) + '</span>';

    const list = document.createElement('div');
    list.className = 'cat-items';

    (cat.items||[]).forEach((it, ii) => {
      const row = document.createElement('div');
      row.className = 'item';
      row.dataset.ci = ci; row.dataset.ii = ii;
      row.innerHTML = '<span class="name">' + it.name + '</span><span class="cmd">(' + (it.command||'') + ')</span>';
      row.onclick = () => selectItem(ci, ii, row);
      list.appendChild(row);
    });

    head.onclick = () => {
      head.classList.toggle('collapsed');
      list.classList.toggle('collapsed');
    };

    wrap.appendChild(head);
    wrap.appendChild(list);
    sidebar.appendChild(wrap);
  });
}

function optRow(o, saved){
  const row = document.createElement('div');
  row.className = 'opt-row';
  const label = document.createElement('label');
  label.textContent = o.label || o.key;
  row.appendChild(label);
  const has = saved && Object.prototype.hasOwnProperty.call(saved, o.key);
  const val = has ? saved[o.key] : o.default;
  let input;
  if(o.type === 'check'){
    input = document.createElement('input'); input.type = 'checkbox';
    input.checked = has ? (val === true || val === '1' || val === 'true') : !!o.default;
  } else if(o.type === 'choice'){
    input = document.createElement('select');
    (o.values||[]).forEach(v=>{
      const opt = document.createElement('option');
      const ov = typeof v === 'string' ? v : v.value;
      const lab = typeof v === 'string' ? v : (v.label||v.value);
      opt.value = ov; opt.textContent = lab;
      input.appendChild(opt);
    });
    if(val!==undefined && val!==null) input.value = val;
  } else {
    input = document.createElement('input');
    input.type = (o.type === 'number' || o.type === 'int') ? 'number' : 'text';
    input.value = val!==undefined && val!==null ? val : '';
  }
  input.dataset.optKey = o.key;
  input.dataset.optType = o.type;
  row.appendChild(input);
  return row;
}

// 오른쪽 화면(옵션 카드)에 그려진 입력칸에서 현재 값을 모은다. check 는 "1"/"0" 문자열로 보낸다.
function collectOptionValues(){
  const values = {};
  content.querySelectorAll('[data-opt-key]').forEach(el => {
    if(el.dataset.optType === 'check'){
      values[el.dataset.optKey] = el.checked ? '1' : '0';
    } else {
      values[el.dataset.optKey] = el.value;
    }
  });
  return values;
}

function selectItem(ci, ii, rowEl){
  document.querySelectorAll('.item.selected').forEach(e=>e.classList.remove('selected'));
  if(rowEl) rowEl.classList.add('selected');

  const cat = catalog.categories[ci];
  const it = cat.items[ii];

  content.innerHTML = '';
  const h1 = document.createElement('h1'); h1.textContent = it.name;
  const desc = document.createElement('div'); desc.className='desc';
  desc.textContent = (it.desc||'') + '   (' + (it.lisp?it.lisp+' · ':'') + it.command + ')';
  content.appendChild(h1); content.appendChild(desc);

  if(it.options && it.options.length){
    const card = document.createElement('div'); card.className='card';
    const h2 = document.createElement('h2'); h2.textContent='옵션'; card.appendChild(h2);
    const saved = (state.values && state.values[it.lisp + '|' + it.command.toUpperCase()]) || null;
    it.options.forEach(o=>card.appendChild(optRow(o, saved)));
    content.appendChild(card);
  }

  const manualCard = document.createElement('div'); manualCard.className='card'; manualCard.style.flex='1 1 auto'; manualCard.style.display='flex'; manualCard.style.flexDirection='column';
  const h2m = document.createElement('h2'); h2m.textContent='설명서'; manualCard.appendChild(h2m);
  const manual = document.createElement('div'); manual.className='manual';
  manual.textContent = it.manual || it.desc || '';
  manualCard.appendChild(manual);
  content.appendChild(manualCard);

  const actions = document.createElement('div'); actions.className='actions';
  const run = document.createElement('button'); run.className='primary big'; run.textContent='▶ 실행';
  run.onclick = () => {
    if(selectedWindow < 0){ log('대상 CAD 창이 없습니다. "창 찾기"를 먼저 눌러 주세요.'); return; }
    const values = collectOptionValues();
    window.runItem(it.lisp||'', it.command, selectedWindow, values)
      .then(msg => log(msg))
      .catch(err => log('실행 오류: ' + err));
  };
  const reset = document.createElement('button'); reset.textContent='옵션 기본값';
  reset.onclick = () => {
    content.querySelectorAll('[data-opt-key]').forEach(el => {
      const o = (it.options||[]).find(x => x.key === el.dataset.optKey);
      if(!o) return;
      if(o.type === 'check') el.checked = !!o.default;
      else el.value = o.default!==undefined && o.default!==null ? o.default : '';
    });
    log('옵션을 기본값으로 되돌림');
  };
  actions.appendChild(run); actions.appendChild(reset);

  const lisp = (catalog.lisps||[]).find(l=>l.id===it.lisp);
  if(lisp && lisp.tools && lisp.tools.length){
    const tools = document.createElement('button'); tools.textContent='외부 프로그램 설치';
    tools.onclick = () => {
      log('외부 프로그램 설치 시작: ' + lisp.tools.map(t=>t.name).join(', '));
      window.installTools(it.lisp).catch(err => log('외부 프로그램 설치 오류: ' + err));
    };
    actions.appendChild(tools);
  }
  content.appendChild(actions);
}

document.getElementById('btnFind').onclick = findWindows;
document.getElementById('btnUpdCfg').onclick = () => {
  log('업데이트 확인 중... (완료되면 아래 로그에 결과가 표시됩니다)');
  window.checkForUpdates().catch(err => log('업데이트 확인 오류: ' + err));
};

const advOverlay = document.getElementById('advOverlay');
const advMethod = document.getElementById('advMethod');
const advCancel = document.getElementById('advCancel');
const advTop = document.getElementById('advTop');
const advEnc = document.getElementById('advEnc');
advMethod.value = state.method || 'WM_COPYDATA';
advCancel.checked = !!state.cancel;
advTop.checked = !!state.topmost;
advEnc.value = state.encoding || 'cp949';

document.getElementById('btnAdv').onclick = () => advOverlay.classList.add('show');
document.getElementById('advClose').onclick = () => advOverlay.classList.remove('show');
advOverlay.addEventListener('click', e => { if(e.target === advOverlay) advOverlay.classList.remove('show'); });

advMethod.addEventListener('change', () => window.setMethod(advMethod.value));
advEnc.addEventListener('change', () => window.setEncoding(advEnc.value));
advCancel.addEventListener('change', () => window.setCancel(advCancel.checked));
advTop.addEventListener('change', () => window.setTopmost(advTop.checked));

document.getElementById('advCheckUpdate').onclick = () => {
  log('업데이트 확인 중... (완료되면 아래 로그에 결과가 표시됩니다)');
  window.checkForUpdates().catch(err => log('업데이트 확인 오류: ' + err));
};
function sendFreeCmd(){
  const el = document.getElementById('advFree');
  const t = el.value.trim();
  if(!t) return;
  if(selectedWindow < 0){ log('대상 CAD 창이 없습니다. "창 찾기"를 먼저 눌러 주세요.'); return; }
  window.sendFree(selectedWindow, t + '\n').then(msg => log(msg)).catch(err => log('전송 오류: ' + err));
  el.value = '';
}
document.getElementById('advSend').onclick = sendFreeCmd;
document.getElementById('advFree').addEventListener('keydown', e => { if(e.key === 'Enter') sendFreeCmd(); });

renderSidebar();
log('리습 목록 불러옴 (기능 ' + (catalog.categories||[]).reduce((n,c)=>n+(c.items?c.items.length:0),0) + '개)');
// window.findWindows 등 Go쪽 바인딩이 페이지 스크립트보다 먼저 준비되지만,
// 혹시 몰라 한 틱 늦춰서 호출해 초기 렌더링에 영향이 없게 한다.
setTimeout(findWindows, 0);

// 처음 열었을 때 바로 '실행' 화면이 보이도록 첫 분류의 첫 기능을 미리 선택해둔다.
(function selectFirst(){
  const cats = catalog.categories || [];
  for(let ci=0; ci<cats.length; ci++){
    if(cats[ci].items && cats[ci].items.length){
      const row = sidebar.querySelector('.item[data-ci="'+ci+'"][data-ii="0"]');
      selectItem(ci, 0, row);
      return;
    }
  }
})();
</script>
</body>
</html>
